[project]
name = "disgundem"
version = "0.1.0"
description = "Dış Gündem toplama, sınıflandırma ve ölçüm hattı"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "python-dateutil>=2.9",
  "supabase>=2.6",
  "selectolax>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
disgundem = "disgundem.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["disgundem*"]

[tool.ruff]
line-length = 110
