name: pipeline

on:
  schedule:
    - cron: "17 */3 * * *"      # 3 saatte bir toplama (UTC); think tank kaynakları kendi haftalık aralığıyla
    - cron: "41 3 * * 1"        # haftalık ölçüm + budama raporu (Pazartesi 06:41 İstanbul)
  workflow_dispatch:
    inputs:
      job:
        description: "seed | fetch | classify | measure | check-feeds | chrome-import"
        default: "check-feeds"
      file:
        description: "chrome-import için oturum dosyası (boşsa data/premium/ altındaki tüm JSON'lar)"
        default: ""

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'none' }}
  LLM_MODEL: ${{ vars.LLM_MODEL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  # Önem hunisi eşikleri (Settings → Variables ile değiştirilebilir)
  IMPORTANCE_STORE_MIN: ${{ vars.IMPORTANCE_STORE_MIN || '3' }}
  IMPORTANCE_QUEUE_MIN: ${{ vars.IMPORTANCE_QUEUE_MIN || '4' }}
  QUEUE_PER_COUNTRY_DAILY: ${{ vars.QUEUE_PER_COUNTRY_DAILY || '4' }}
  QUEUE_TOTAL_DAILY: ${{ vars.QUEUE_TOTAL_DAILY || '30' }}
  ECON_QUEUE_MIN: ${{ vars.ECON_QUEUE_MIN || '3' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "./pipeline[llm]"
      - name: DRY_RUN kararı (secrets yoksa dry-run; hat yine çalışır, çıktılar artifact olur)
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "DRY_RUN=1" >> $GITHUB_ENV; else echo "DRY_RUN=0" >> $GITHUB_ENV; fi
      - name: Komutu seç
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "job=${{ inputs.job }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "41 3 * * 1" ]; then echo "job=measure" >> $GITHUB_OUTPUT
          else echo "job=fetch" >> $GITHUB_OUTPUT; fi
      - name: seed
        if: steps.pick.outputs.job == 'seed'
        run: disgundem seed
      - name: fetch + classify
        if: steps.pick.outputs.job == 'fetch'
        run: |
          disgundem fetch
          disgundem classify --limit 300
      - name: classify
        if: steps.pick.outputs.job == 'classify'
        run: disgundem classify --limit 500
      - name: measure
        if: steps.pick.outputs.job == 'measure'
        run: disgundem measure --days 30 --report
      - name: check-feeds
        if: steps.pick.outputs.job == 'check-feeds'
        run: disgundem check-feeds
      - name: chrome-import
        if: steps.pick.outputs.job == 'chrome-import'
        env:
          FILE: ${{ inputs.file }}
        run: |
          if [ -n "$FILE" ]; then files="$FILE"; else files=$(ls data/premium/*.json 2>/dev/null | sort); fi
          [ -z "$files" ] && { echo "içe alınacak dosya yok"; exit 0; }
          for f in $files; do echo "== $f"; disgundem chrome-import "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ steps.pick.outputs.job }}-${{ github.run_id }}
          path: data/out/
          if-no-files-found: ignore
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./pipeline pytest
      - run: cd pipeline && python -m pytest -q
